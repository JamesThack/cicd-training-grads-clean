on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Say hello
        run: echo "Hello ${{ github.actor }}! "
      - name: Build Docker image
        run: docker build -t cicd-training-2026 .
    
