name: 2 - Docker Build

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  hello:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t cicd-training-2026 .
      - name: Create Release
        id: create_release
        uses: comnoco/create-release@v2
        with:
          release_name: "cicd-training-2026"
