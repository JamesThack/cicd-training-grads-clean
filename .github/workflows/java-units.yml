name: 3 - Run Unit Tests

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  build:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
        - name: Checkout step
          uses: actions/checkout@v4
        - name: Setup Java
          uses: actions/setup-java@v6
          with:
            distribution: 'temurin'
            java-version: '21'
            cache: 'maven'
        - run: java --version
        - name: Run with Maven
          run: mvn -B test
        - name: Docker build
          run: docker build -t cicd-training-2026 .
 