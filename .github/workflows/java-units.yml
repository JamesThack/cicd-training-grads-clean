name: 3 - Junit Tests

# Run manually from the Actions tab ("Run workflow" button)
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version-file: .java-version
      - run: java --version
      - run: mvn -B test 